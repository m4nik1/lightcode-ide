name: auto-update-codex-version

on:
  schedule:
    - cron: "30 5 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write
  pull-requests: write

jobs:
  check-codex-version:
    name: Check Codex version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Regenerate and verify Codex protocol
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: "gpt-5.6-sol"
          effort: "medium"
          permission-profile: ":workspace"
          prompt-file: ".github/codex/update-codex-version.md"

